<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trace</title>
<style>
:root {
	--bg: #0e1116;
	--panel: #151a21;
	--raised: #1b2129;
	--line: #2a323c;
	--text: #e2e8f0;
	--soft: #c3cbd6;
	--muted: #9aa5b4;
	--run: #e3b341;
	--tool: #6cb6ff;
	--ok: #4fd1a5;
	--err: #ff8a65;
	--sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
	--mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
	color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.dim { color: var(--muted); }
.c-run { color: var(--run); } .c-tool { color: var(--tool); } .c-ok { color: var(--ok); } .c-err { color: var(--err); }
[hidden] { display: none; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 700 15px var(--mono); display: flex; gap: 8px; }
.session { display: flex; flex-direction: column; min-width: 0; max-width: 360px; }
.session b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session span { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font: 700 12px var(--mono); }
.pill.live { background: #2e2614; color: var(--run); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--run); }
.pill.replay { background: var(--raised); color: var(--muted); }
.pill[hidden] { display: none; }
#stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 13px var(--mono); }
.tbar { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
.tbar-track { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.tbar-legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
.grow { flex: 1 1 0; }
.field { display: flex; align-items: center; min-height: 36px; padding: 0 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; }
.field input, .field select { background: transparent; border: 0; outline: none; font: 13px var(--mono); min-width: 0; }
.field select option { background: var(--raised); }
#q { width: 220px; }
#pick-session { max-width: 180px; }
.filebtn { cursor: pointer; font-size: 13px; color: var(--muted); }
.filebtn input { display: none; }

nav { display: flex; gap: 4px; padding: 6px 20px 0; border-bottom: 1px solid var(--line); }
nav button { min-height: 38px; padding: 0 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
nav button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--run); }
nav kbd { font: 11px var(--mono); color: #7f8a99; margin-left: 4px; }

main { flex: 1; display: flex; min-height: 0; }
#view { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
#inspector { flex: 0 0 360px; overflow: auto; padding: 20px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-align: left; }
.card.sel { border: 2px solid var(--run); padding: 11px 13px; }
.card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .state { margin-left: auto; font-size: 12px; }
.card .now { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .mono.dim { font-size: 12px; }
.card .task { color: var(--soft); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.flow { display: flex; flex-wrap: wrap; align-items: flex-start; }
.main-col { flex: 0 1 380px; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font: 12px var(--mono); }
.link { flex: 0 0 40px; height: 56px; border-bottom: 2px solid var(--run); opacity: .6; }
.kids { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; border-left: 2px solid var(--line); }
.kids.empty { border: 0; padding: 18px 0 0 12px; font-size: 13px; }
.kid { display: flex; align-items: center; }
.edge { flex: 0 0 28px; border-top: 2px solid; }

.timeline { display: flex; flex-direction: column; gap: 12px; }
.era { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.era.sel { border: 2px solid var(--run); padding: 11px 13px; }
.era-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.era-head .mono { font-size: 12px; }
.era-meta { margin-left: auto; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 28px; }
.bar { flex: 1 1 0; max-width: 28px; min-width: 3px; border: 0; padding: 0; border-radius: 2px; }
.bar.sel { outline: 2px solid var(--text); outline-offset: 1px; }
.bar.dimmed { opacity: .2; }
.mks { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 12px var(--mono); color: var(--muted); }
.mk-compaction, .mk-branch { color: var(--soft); }
.mk-label { color: var(--run); }
.branch { margin-left: 32px; padding-left: 12px; border-left: 2px dashed #5a6472; opacity: .72; display: flex; flex-direction: column; gap: 8px; }
.branch-head { font-size: 12px; }
.branch-sum { font-size: 12px; }

.ctx { display: flex; flex-direction: column; gap: 14px; }
.ctx-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.ctx-head b { font-size: 16px; }
.ctx-head .mono { font-size: 13px; }
.stack { position: relative; display: flex; height: 34px; border-radius: 6px; overflow: hidden; background: var(--raised); }
.stack .cut { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend-row .hi { color: var(--text); }
.ctx-cards { display: flex; flex-wrap: wrap; gap: 16px; }
.panel { flex: 1 1 260px; min-width: 0; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.panel.wide { flex: 2 1 380px; }
.sparks { display: flex; align-items: flex-end; gap: 4px; height: 64px; }
.spark { flex: 1; border: 0; padding: 0; border-radius: 2px; }
.spark.sel { outline: 2px solid var(--text); outline-offset: 1px; }
.dl { display: flex; gap: 10px; padding: 2px 6px; border-radius: 4px; font: 12px var(--mono); }
.dl span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl.add { background: #13261f; } .dl.add b { color: var(--ok); }
.dl.chg { background: #2a2414; } .dl.chg b { color: var(--run); }
.dl.del { background: #2a1a16; } .dl.del b { color: var(--err); }

.ins-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.ins-head .state { margin-left: auto; font-size: 12px; }
.ins-head .mono.dim { font-size: 12px; }
.sect { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.quote { padding: 10px 12px; background: var(--raised); border-radius: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.think { font-size: 13px; color: var(--soft); overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.metric { padding: 8px 10px; background: var(--raised); border-radius: 8px; display: flex; flex-direction: column; gap: 2px; }
.metric span { color: var(--muted); font-size: 11px; }
.metric-v { font: 500 14px var(--mono); overflow-wrap: anywhere; }
.call { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid #222932; font: 12px var(--mono); }
.call > :first-child { flex: 0 0 56px; }
.call .arg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { min-height: 36px; padding: 0 12px; background: var(--raised); border: 1px solid var(--run); border-radius: 8px; color: var(--run); }

footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 20px; background: var(--panel); border-top: 1px solid var(--line); }
.transport { display: flex; gap: 6px; }
.ctl { min-height: 36px; min-width: 36px; padding: 0 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; }
#play { background: var(--run); color: #141414; border: 0; font-weight: 700; }
#speed { font: 13px var(--mono); }
#gaps.on { background: #2e2614; border-color: var(--run); color: var(--run); }
#tolive { border-color: var(--run); font: 13px var(--mono); }
#scrub { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 4px; cursor: pointer; user-select: none; }
.track { position: relative; height: 22px; }
.band { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #2b3440; border-left: 2px solid var(--bg); cursor: pointer; }
.band.live { background: #3d3418; }
.track .head { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--text); pointer-events: none; }
.ticks { position: relative; height: 14px; font-size: 12px; color: var(--muted); }
.tick { position: absolute; transform: translateX(-50%); }
.scale { display: flex; justify-content: space-between; font-size: 11px; }

#drop { position: fixed; inset: 120px 40px 90px; display: grid; place-items: center; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); background: rgba(14,17,22,.85); text-align: center; padding: 20px; }
#drop[hidden] { display: none; }
body.dragging #drop[hidden], body.dragging #drop { display: grid; border-color: var(--run); color: var(--run); }

@media (max-width: 900px) {
	main { flex-direction: column; overflow: auto; }
	#view { overflow: visible; padding: 16px; }
	#inspector { flex: none; border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
	header, nav, footer { padding-left: 16px; padding-right: 16px; }
	#q { width: 140px; }
}
</style>
</head>
<body>
<header>
	<div class="brand"><span class="c-run">◐</span>trace</div>
	<div class="session"><b id="title">…</b><span id="subtitle"></span></div>
	<span id="live" class="pill live" hidden>LIVE</span>
	<span id="replay" class="pill replay" hidden>REPLAY</span>
	<div id="stats"></div>
	<div class="grow"></div>
	<label class="field" title="Открыть другую сессию"><select id="pick-session" aria-label="Другая сессия"><option value="">другая сессия…</option></select></label>
	<label class="field filebtn" title="Открыть .jsonl с диска">файл…<input id="pick-file" type="file" accept=".jsonl"></label>
	<label class="field"><input id="q" type="search" placeholder="tool:bash err T12..T20" aria-label="Фильтр ходов"></label>
</header>
<nav aria-label="Виды">
	<button type="button" data-view="flow">Flow<kbd>1</kbd></button>
	<button type="button" data-view="timeline">Timeline<kbd>2</kbd></button>
	<button type="button" data-view="context">Context<kbd>3</kbd></button>
</nav>
<main>
	<section id="view"></section>
	<aside id="inspector" aria-label="Инспектор"></aside>
</main>
<footer>
	<div class="transport">
		<button type="button" class="ctl" id="prev" aria-label="Предыдущая эра" title="предыдущая эра">⏮</button>
		<button type="button" class="ctl" id="play" aria-label="Воспроизведение" title="пробел">▶</button>
		<button type="button" class="ctl" id="next" aria-label="Следующая эра" title="следующая эра">⏭</button>
	</div>
	<select class="ctl" id="speed" aria-label="Скорость">
		<option value="1">1×</option><option value="8">8×</option><option value="32">32×</option><option value="128">128×</option>
	</select>
	<button type="button" class="ctl" id="gaps" title="s">сжать паузы</button>
	<div id="scrub" title="Шкала сессии: клик или перетаскивание — перемотка"></div>
	<button type="button" class="ctl" id="tolive" title="g">к live · g</button>
</footer>
<div id="drop" hidden>Перетащите .jsonl сессии pi сюда<br>или откройте вьюер через <span class="mono">/trace web</span></div>
<script type="module" src="main.js"></script>
</body>
</html>

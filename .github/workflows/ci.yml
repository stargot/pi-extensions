name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The package is developed on Windows (pwsh/WezTerm panes, taskkill
    # tree-kills) — gate on the platform it actually targets.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the engines floor (unflagged type stripping); 24 is current LTS.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

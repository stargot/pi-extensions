name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The package is developed on Windows (pwsh/WezTerm panes, taskkill
    # tree-kills) — gate on the platform it actually targets.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

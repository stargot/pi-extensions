name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The package is developed on Windows (pwsh/WezTerm panes, taskkill
    # tree-kills) — gate on the platform it actually targets. The repo is
    # public and git consumers do run it on Linux, so gate both platforms.
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the engines floor (unflagged type stripping); 24 is current LTS.
        os: [windows-latest, ubuntu-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
